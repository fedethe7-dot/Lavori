<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Lavori di casa condivisi con la famiglia">
  <title>Lavori di casa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="hello" id="hello">Ciao 👋</div>
    <div class="top-actions">
      <button class="icon-btn" id="btnSync" aria-label="Aggiorna">🔄</button>
      <button class="me-btn" id="btnMe" aria-label="Impostazioni">⚙️</button>
    </div>
  </header>

  <div id="avvisi"></div>
  <main id="main"></main>

  <button class="fab" id="fab" aria-label="Nuovo lavoro">＋</button>

  <nav class="tabs" id="tabs">
    <button data-view="home"><span>🏠</span>Lavori</button>
    <button data-view="liberi"><span>🙋</span>Giorni liberi</button>
    <button data-view="fatti"><span>✔️</span>Fatti</button>
  </nav>

  <div class="sheet-bg hidden" id="sheetBg">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script src="firebase-config.js"></script>
  <script src="logica.js"></script>
  <script src="app.js"></script>
</body>
</html>
