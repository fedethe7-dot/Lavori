<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="/Casa/blocco.js"></script><!-- sblocco a sequenza comune (hub) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Lavori di casa condivisi con la famiglia">
  <title>Lavori di casa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="hello" id="hello">Ciao 👋</div>
    <div class="top-actions">
      <a class="icon-btn" href="../Casa/" aria-label="Le mie app" title="Le mie app"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="#34a373"/><rect x="13" y="3" width="8" height="8" rx="2.5" fill="#e0962f"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill="#9b72ff"/><rect x="13" y="13" width="8" height="8" rx="2.5" fill="#8fa6ff"/></svg></a>
      <button class="icon-btn" id="btnSync" aria-label="Aggiorna">🔄</button>
      <button class="me-btn" id="btnMe" aria-label="Impostazioni">⚙️</button>
    </div>
  </header>

  <div id="avvisi"></div>
  <main id="main"></main>

  <button class="fab" id="fab" aria-label="Nuovo lavoro">＋</button>

  <nav class="tabs" id="tabs">
    <button data-view="home"><span>🏠</span>Lavori</button>
    <button data-view="progetti"><span>💡</span>Progetti</button>
    <button data-view="spesa"><span>🧰</span>Attrezzi<b class="cnt hidden" id="spesaCnt"></b></button>
    <button data-view="liberi"><span>🙋</span>Liberi</button>
    <button data-view="fatti"><span>✔️</span>Fatti</button>
  </nav>

  <div class="sheet-bg hidden" id="sheetBg">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script src="logica.js"></script>
  <script src="app.js"></script>
</body>
</html>
